# 로컬의 scripts/k8s_secrets.sh 대신. DATABASE_URL은 비밀번호로 여기서 조합한다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiops-secrets
  namespace: aiops
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target:
    name: aiops-secrets
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql://aiops:{{ .POSTGRES_PASSWORD }}@postgres:5432/aiops"
  dataFrom:
    - extract: {key: ai-incident/aiops}

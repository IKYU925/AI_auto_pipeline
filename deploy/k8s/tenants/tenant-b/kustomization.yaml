# 고객사 tenant-b의 shopapi. 메모리를 늘리지 않도록 replica는 1개다(plan.md 9-7)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenant-b
resources:
  - ../../shopapi
patches:
  - target: {kind: Deployment, name: shopapi}
    patch: |
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Ingress, name: shopapi}
    patch: |
      - {op: replace, path: /spec/rules/0/host, value: tenant-b.192.168.56.10.nip.io}

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations: {storageclass.kubernetes.io/is-default-class: "true"}
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters: {type: gp3}
---
# 인증은 External Secrets 컨트롤러의 Pod Identity를 쓴다
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws: {service: SecretsManager, region: ap-northeast-2}
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# Alertmanager가 자동화 웹훅에 Bearer로 보내는 토큰. api는 같은 값을 aiops-secrets의 AUTOMATION_TOKEN으로 받는다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-automation-token
  namespace: monitoring
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target: {name: ai-automation-token}
  data:
    - secretKey: token
      remoteRef: {key: ai-incident/aiops, property: AUTOMATION_TOKEN}

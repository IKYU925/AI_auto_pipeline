# Prometheus(kube-prometheus-stack)는 모든 namespace의 ServiceMonitor를 읽는다(plan.md 9-2). 별도 라벨이 필요 없다
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shopapi
  namespace: shop
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: shopapi}
  endpoints:
    - {port: http, path: /metrics, interval: 15s}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-api
  namespace: aiops
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: ai-api}
  endpoints:
    - {port: http, path: /metrics, interval: 15s}

# 자동화 시스템. 비밀값(API 키, 토큰, DB 비밀번호)은 aiops-secrets로 들어온다(scripts/k8s_secrets.sh, Git에 없음)
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
data:
  REDIS_URL: redis://redis:6379/0
  LIGHT_MODEL: anthropic:claude-haiku-5-5
  HEAVY_MODEL: anthropic:claude-opus-5-5
  INCIDENT_BUDGET_USD: "1.0"
  MAX_FIX_ATTEMPTS: "3"
  TARGET_REPO_PATH: /repo
  ARTIFACTS_DIR: /srv/artifacts
  # Pod를 지운 뒤 다른 워커가 30초 뒤 메시지를 회수한다(plan.md 9-6, 2단계 docker kill 실험과 같은 값)
  QUEUE_CLAIM_IDLE_MS: "30000"
  LOKI_URL: http://loki.monitoring.svc:3100
  ALERT_SLACK_CHANNEL: C0CJKRZD0AU
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ai-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ai-api}
    spec:
      nodeSelector: {workload: app}
      # 마이그레이션은 api가 뜰 때마다 한다(멱등). Job은 이미지를 바꿀 수 없어 버그 주입 이미지로 재배포할 때마다 적용이 실패했다
      initContainers:
        - name: wait
          image: aiops
          command: ["python", "-m", "app.wait"]
          envFrom: [{configMapRef: {name: aiops-config}}, {secretRef: {name: aiops-secrets}}]
        - name: migrate
          image: aiops
          command: ["python", "-m", "app.db"]
          envFrom: [{configMapRef: {name: aiops-config}}, {secretRef: {name: aiops-secrets}}]
      containers:
        - name: api
          image: aiops
          envFrom: [{configMapRef: {name: aiops-config}}, {secretRef: {name: aiops-secrets}}]
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 768Mi}
---
# Alertmanager 수신처가 http://ai-api.aiops.svc:8000/api/v1/alerts/alertmanager 이다(plan.md 9-3)
apiVersion: v1
kind: Service
metadata:
  name: ai-api
  namespace: aiops
spec:
  selector: {app.kubernetes.io/name: ai-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-api
  namespace: aiops
spec:
  rules:
    - host: aiops.192.168.56.10.nip.io
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: ai-api, port: {name: http}}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: aiops
spec:
  # Consumer Group이라 늘려도 메시지가 중복 처리되지 않는다. 한쪽을 지우면 다른 쪽이 회수한다
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: ai-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ai-worker}
    spec:
      nodeSelector: {workload: app}
      initContainers:
        - name: wait
          image: aiops
          command: ["python", "-m", "app.wait", "--schema"]
          envFrom: [{configMapRef: {name: aiops-config}}, {secretRef: {name: aiops-secrets}}]
      containers:
        - name: worker
          image: aiops
          command: ["python", "-m", "app.worker"]
          envFrom: [{configMapRef: {name: aiops-config}}, {secretRef: {name: aiops-secrets}}]
          volumeMounts:
            - {name: artifacts, mountPath: /srv/artifacts}
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 768Mi}
      volumes:
        - {name: artifacts, emptyDir: {}}

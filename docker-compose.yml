services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # 큐 메시지가 재시작 후에도 남도록 AOF 사용
    volumes: [redis-data:/data]
    ports: ["6379:6379"]

  # 2단계 검색 비교(eval/retrieval)의 기준선 측정에만 쓴다: docker compose --profile eval up -d qdrant
  qdrant:
    image: qdrant/qdrant:latest
    profiles: [eval]
    ports: ["6333:6333"]

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=aiops
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aiops}
      - POSTGRES_DB=aiops
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 2s
      retries: 30

  # 스키마를 최신으로 올리고 끝난다. api와 worker는 이 작업이 성공한 뒤에 뜬다
  migrate:
    build: .
    env_file: .env
    environment: &db
      - DATABASE_URL=postgresql://aiops:${POSTGRES_PASSWORD:-aiops}@postgres:5432/aiops
    command: ["python", "-m", "app.db"]   # alembic upgrade head + LangGraph 체크포인트 테이블
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    env_file: .env
    environment: *db
    depends_on:
      redis: {condition: service_started}
      migrate: {condition: service_completed_successfully}
    ports: ["8000:8000"]

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    environment: *db
    depends_on:
      redis: {condition: service_started}
      migrate: {condition: service_completed_successfully}
    volumes:
      # 수정안을 검증할 대상 저장소. 워커는 이 경로를 읽기 전용으로 복사해서 쓰고 원본은 건드리지 않는다
      - ./targets/shopapi:/repo:ro
      - artifacts:/srv/artifacts
    deploy:
      replicas: 2     # Consumer Group이라 워커를 늘려도 메시지가 중복 처리되지 않는다

  # 장애를 주입할 대상 서비스. 워커와 같은 소스를 보므로 inject.sh로 버그를 넣으면 둘 다 바로 반영된다
  shopapi:
    build: .
    working_dir: /repo
    command: ["uvicorn", "shopapi.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8100", "--reload"]
    environment:
      - PG_API_KEY=${SHOPAPI_PG_API_KEY:-dev-key}
      - SLACK_WEBHOOK_URL=${SHOPAPI_SLACK_WEBHOOK_URL:-}
    volumes:
      - ./targets/shopapi:/repo:ro
    ports: ["8100:8100"]

  n8n:
    image: n8nio/n8n:latest
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - AUTOMATION_TOKEN=${AUTOMATION_TOKEN}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
    ports: ["5678:5678"]
    volumes: [n8n-data:/home/node/.n8n]

volumes:
  redis-data:
  postgres-data:
  n8n-data:
  artifacts:
